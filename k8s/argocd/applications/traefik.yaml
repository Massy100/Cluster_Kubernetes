apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-config
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Massy100/Cluster_Kubernetes.git
    targetRevision: main
    path: k8s/platform/traefik
    directory:
      include: helmchartconfig.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true