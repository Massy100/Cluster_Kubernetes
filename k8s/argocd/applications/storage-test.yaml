apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: storage-test
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Massy100/Cluster_Kubernetes.git
    targetRevision: main
    path: k8s/platform/storage
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true