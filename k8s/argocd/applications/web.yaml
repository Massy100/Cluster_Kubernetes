apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubelab-web
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Massy100/Cluster_Kubernetes.git
    targetRevision: main
    path: k8s/apps/web

  destination:
    server: https://kubernetes.default.svc
    namespace: kubelab

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true

  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: kubelab-web
      namespace: kubelab
      jsonPointers:
        - /spec/replicas