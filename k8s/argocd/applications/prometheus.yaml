apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: prometheus
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 29.39.0

    helm:
      releaseName: prometheus

      valuesObject:

        # Desactivar componentes adicionales
        alertmanager:
          enabled: false

        prometheus-pushgateway:
          enabled: false

        prometheus-node-exporter:
          enabled: false

        kube-state-metrics:
          enabled: false

        # Trabajos de monitoreo
        # Debe estar al mismo nivel que server
        scrapeConfigs:
          kubelab-api:
            enabled: true
            job_name: kubelab-api
            metrics_path: /metrics
            scrape_interval: 30s
            static_configs:
              - targets:
                  - kubelab-api.kubelab.svc.cluster.local:80

        # Servidor Prometheus
        server:

          global:
            scrape_interval: 30s
            evaluation_interval: 30s

          # Retencion corta para ahorrar almacenamiento
          retention: 3d
          retentionSize: 1GB

          # Recursos limitados para Proxmox
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi

          # Almacenamiento persistente
          persistentVolume:
            enabled: true
            size: 2Gi
            storageClass: local-path

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: false
      selfHeal: true

    syncOptions:
      - CreateNamespace=true