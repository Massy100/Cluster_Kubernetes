valuesObject:
        alertmanager:
          enabled: false

        prometheus-pushgateway:
          enabled: false

        prometheus-node-exporter:
          enabled: false

        kube-state-metrics:
          enabled: false

        scrapeConfigs:
          kubelab-api:
            enabled: true
            job_name: kubelab-api
            metrics_path: /metrics
            scrape_interval: 30s
            static_configs:
              - targets:
                  - kubelab-api.kubelab.svc.cluster.local:80

        server:
          global:
            scrape_interval: 30s
            evaluation_interval: 30s