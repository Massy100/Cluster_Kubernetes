apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 29.39.0
    helm:
      releaseName: prometheus
      valuesObject:
        alertmanager:
          enabled: false

        prometheus-pushgateway:
          enabled: false

        prometheus-node-exporter:
          enabled: false

        kube-state-metrics:
          enabled: false

        server:
          global:
            scrape_interval: 30s
            evaluation_interval: 30s

          retention: 3d
          retentionSize: 1GB

          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi

          persistentVolume:
            enabled: true
            size: 2Gi
            storageClass: local-path

          scrapeConfigs:
            kubelab-api:
              enabled: true
              job_name: kubelab-api
              metrics_path: /metrics
              static_configs:
                - targets:
                    - kubelab-api.kubelab.svc.cluster.local:80

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true