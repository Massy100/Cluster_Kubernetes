apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  namespace: kubelab
spec:
  serviceName: postgresql
  replicas: 1

  selector:
    matchLabels:
      app: postgresql

  template:
    metadata:
      labels:
        app: postgresql

    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker1

      securityContext:
        fsGroup: 999

      containers:
        - name: postgresql
          image: postgres:16
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5432
              name: postgres

          envFrom:
            - secretRef:
                name: postgresql-credentials

          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          args:
            - "-c"
            - "shared_buffers=32MB"
            - "-c"
            - "max_connections=20"

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi

          startupProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 5
            failureThreshold: 24

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            periodSeconds: 10

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 2Gi