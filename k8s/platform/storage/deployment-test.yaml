apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubelab-storage-test
  namespace: default
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kubelab-storage-test
  template:
    metadata:
      labels:
        app: kubelab-storage-test
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker1
      containers:
        - name: busybox
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - sleep 360000
          volumeMounts:
            - name: test-data
              mountPath: /data
      volumes:
        - name: test-data
          persistentVolumeClaim:
            claimName: kubelab-storage-test