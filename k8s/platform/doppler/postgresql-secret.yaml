
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: kubelab-postgresql
  namespace: doppler-operator-system
spec:
  tokenSecret:
    name: doppler-token-secret
    namespace: doppler-operator-system

  project: kubelab
  config: prd

  secrets:
    - POSTGRES_DB
    - POSTGRES_USER
    - POSTGRES_PASSWORD

  managedSecret:
    name: postgresql-credentials
    namespace: kubelab
    type: Opaque
